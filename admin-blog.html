<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog CMS | Review Hubs</title>
  <style>
    :root{color-scheme:dark;--bg:#06110e;--panel:#0b1e19;--line:#24453b;--text:#f6faf8;--muted:#99cfc1;--lime:#baff42;--danger:#ff8d82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.shell{max-width:1280px;margin:auto;padding:28px}.top,.actions,.post-head{display:flex;align-items:center;gap:12px}.top{justify-content:space-between;margin-bottom:24px}.top h1{margin:0;font-size:28px}.links{display:flex;gap:10px}.button,button{border:0;border-radius:10px;background:var(--lime);color:#07110d;font-weight:800;padding:11px 15px;cursor:pointer;text-decoration:none}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{color:var(--danger);border-color:#6b3531}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.panel h2{margin:0 0 6px}.muted{color:var(--muted)}label{display:block;font-weight:750;margin:14px 0 6px}input,textarea{width:100%;color:var(--text);background:#06140f;border:1px solid var(--line);border-radius:10px;padding:11px 12px}textarea{resize:vertical;min-height:90px}#content{min-height:260px}.url-row{display:grid;grid-template-columns:1fr auto;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checks{display:flex;gap:22px;margin:16px 0}.checks label{display:flex;align-items:center;gap:8px;margin:0}.checks input{width:auto}.preview{display:none;margin-top:12px;width:100%;max-height:260px;object-fit:cover;border:1px solid var(--line);border-radius:12px}.notice{min-height:24px;margin:12px 0;color:var(--muted)}.notice.error{color:var(--danger)}.posts{display:grid;gap:12px;margin-top:18px}.post{border:1px solid var(--line);border-radius:13px;padding:14px}.post h3{margin:0;font-size:16px}.post-head{justify-content:space-between;align-items:flex-start}.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 7px;color:var(--muted)}.post .actions{margin-top:10px}.post button{padding:7px 10px;font-size:13px}.empty{padding:30px 0;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:1fr}.shell{padding:18px}.top{align-items:flex-start;flex-direction:column}.two,.url-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><h1>Blog CMS</h1><div id="admin-email" class="muted"></div></div><nav class="links"><a class="button secondary" href="/admin">Coupons & Deals</a><a class="button secondary" href="/blog.html" target="_blank" rel="noopener">View blog</a></nav></header>
    <div class="grid">
      <section class="panel">
        <h2 id="form-title">New blog post</h2><p class="muted">Paste an official page URL to extract its public image and metadata. Review the generated draft before publishing.</p>
        <form id="post-form">
          <input id="post-id" type="hidden">
          <label for="source-url">Official page URL</label><div class="url-row"><input id="source-url" type="url" placeholder="https://official-site.com/article"><button id="extract" type="button">Extract & draft</button></div>
          <div class="two"><div><label for="title">Title</label><input id="title" required maxlength="180"></div><div><label for="slug">Slug</label><input id="slug" maxlength="180"></div></div>
          <div class="two"><div><label for="brand">Brand</label><input id="brand" maxlength="100"></div><div><label for="category">Category</label><input id="category" maxlength="80" value="Reviews"></div></div>
          <label for="image">Official image URL</label><input id="image" type="url" maxlength="1500"><img id="preview" class="preview" alt="Official page preview">
          <label for="excerpt">Excerpt</label><textarea id="excerpt" maxlength="600"></textarea>
          <label for="content">Article draft</label><textarea id="content" required maxlength="30000"></textarea>
          <div class="checks"><label><input id="featured" type="checkbox"> Featured</label><label><input id="published" type="checkbox"> Published</label></div>
          <div id="notice" class="notice" role="status"></div><div class="actions"><button type="submit">Save post</button><button id="reset" class="secondary" type="button">New post</button></div>
        </form>
      </section>
      <aside class="panel"><h2>Posts</h2><p class="muted">Drafts and published articles.</p><div id="posts" class="posts"><div class="empty">Loading...</div></div></aside>
    </div>
  </main>
  <script src="admin-blog.js"></script>
</body>
</html>
